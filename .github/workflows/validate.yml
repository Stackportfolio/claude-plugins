name: Validate Plugin and Skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate manifests and skill frontmatter
        run: node scripts/validate.mjs

      - name: Run OpenAPI contract guard against staging
        env:
          STACKPORTFOLIO_OPENAPI_BASIC_AUTH: ${{ secrets.STAGING_BASIC_AUTH }}
        run: |
          if [ -z "$STACKPORTFOLIO_OPENAPI_BASIC_AUTH" ]; then
            echo "::notice title=Contract guard skipped::STAGING_BASIC_AUTH secret is not set (e.g. fork PR); skipping contract guard against staging."
            node scripts/contract.mjs
          else
            node scripts/contract.mjs
          fi

      - name: Run unit and fixture tests
        run: node --test test/*.test.mjs

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace manifest with Claude Code
        run: claude plugin validate .

      - name: Validate plugin manifest with Claude Code
        run: claude plugin validate plugins/stackportfolio
